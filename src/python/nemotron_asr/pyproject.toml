[project]
name = "nemotron-asr"
version = "0.1.0"
description = "Drop-in Nemotron 3.5 ASR streaming server for the assistant voice pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=5.13.0,<6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "numpy>=1.26,<3",
    "soundfile>=0.12",
    "ffmpeg-python>=0.2",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.30",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
